openapi: 3.0.3
info:
  title: Insider One Notification API
  version: 1.0.0
  description: Asynchronous multi-channel notification management API.
servers:
  - url: http://localhost:8000/api
paths:
  /notifications:
    post:
      summary: Create notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationInput'
            example: {recipient: '+905551234567', channel: sms, content: 'Your message', priority: high, idempotency_key: 'order-1'}
      responses:
        '201': {description: Created and queued}
        '422': {description: Validation error}
    get:
      summary: List notifications
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [pending, processing, accepted, failed, cancelled]}}
        - {in: query, name: channel, schema: {type: string, enum: [sms, email, push]}}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: Paginated notifications}}
  /notifications/batch:
    post:
      summary: Create up to 1000 notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notifications]
              properties:
                notifications:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: '#/components/schemas/NotificationInput'}
      responses: {'202': {description: 'Batch accepted; response includes batch_id, total, created_count, replayed_count and notifications'}, '422': {description: 'Validation error, including duplicate idempotency keys within a batch'}}
  /notifications/{id}:
    get:
      summary: Get notification status
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Notification}, '404': {description: Not found}}
  /notifications/{id}/cancel:
    post:
      summary: Cancel pending notification
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Cancelled}, '409': {description: Not pending}}
  /batches/{batchId}:
    get:
      summary: Get batch and notification statuses
      parameters: [{in: path, name: batchId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Batch}, '404': {description: Not found}}
  /health:
    get:
      summary: Health check
      responses: {'200': {description: Healthy}, '503': {description: Unhealthy}}
  /metrics:
    get:
      summary: Notification metrics
      responses: {'200': {description: Metrics}}
components:
  schemas:
    NotificationInput:
      type: object
      required: [recipient, channel, content]
      properties:
        recipient: {type: string, maxLength: 320}
        channel: {type: string, enum: [sms, email, push]}
        content: {type: string, maxLength: 10000}
        priority: {type: string, enum: [high, normal, low], default: normal}
        idempotency_key: {type: string, maxLength: 255}
        scheduled_at: {type: string, format: date-time}
