services:
  app:
    build: .
    container_name: insider-notifications-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/var/www/storage
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$r=@file_get_contents('http://127.0.0.1:8000/api/health'); exit($$r===false?1:0);"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  worker:
    build: .
    container_name: insider-notifications-worker
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=high,normal,low,default
      - --sleep=1
      - --tries=1
      - --timeout=30
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    container_name: insider-notifications-scheduler
    command:
      - php
      - artisan
      - schedule:work
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: insider-notifications-mysql
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_USER: notifications
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: insider-notifications-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
