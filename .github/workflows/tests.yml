name: PHP tests
on:
  push:
  pull_request:
jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, bcmath, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax check
        run: find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        env:
          APP_KEY: base64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: ./vendor/bin/phpunit
